# DEPRECATED: not part of the adap_2023 workflow. adap_koa_download.yml downloads raw
# data straight into s3://pypeit/adap_2023/raw_data_reorg, so there is nothing left to
# stage, and stage_raw_data_from_queue.py still expects the older "<dataset>/complete/raw"
# layout. Kept for reference; see workflow.rst before applying it.
apiVersion: batch/v1
kind: Job
metadata:
  name: adap-stage-from-queue
spec:
  backoffLimit: 0
  parallelism: 5
  template:
    spec:
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: stage-worker
        args:
        - source /home/pypeitusr/pypeit_env/bin/activate;
          cd /tmp; mkdir adap_root; cd adap_root;
          git clone https://github.com/pypeit/adap.git; cd adap; git checkout adap_2023;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap/scripts/ scripts/ --recursive;
          python scripts/stage_raw_data_from_queue.py --rclone_conf config/rclone.conf --adap_root_dir /tmp/adap_root "key=1TADKd3OgbA-2U80iiw2dIxIiNXoF0_z_CJ9VZ9_iek4/WorkQueue@B" redis://adap-workqueue:6379 adap_2023 s3
        command:
        - /bin/bash
        - -c
        image: gitlab-registry.nrp-nautilus.io/bradh/pypeitcontainers/pypeit_lris_adap:adap_2023
        imagePullPolicy: Always
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 40Gi
            memory: 8Gi
          requests:
            cpu: '2'
            ephemeral-storage: 40Gi
            memory: 8Gi
        volumeMounts:
        - mountPath: /home/pypeitusr/.config/gspread/service_account.json
          name: gcloud-service-account
          subPath: credentials
        - mountPath: /work_queue
          name: work-queue
        - mountPath: /tmp
          name: ephemeral
        - mountPath: /home/pypeitusr/.aws/credentials
          name: prp-s3-credentials
          subPath: credentials
        env:
           - name: POD_NAME
             valueFrom:
                fieldRef:
                   fieldPath: metadata.name
           - name: ENDPOINT_URL
             value: http://rook-ceph-rgw-nautiluss3.rook
           - name: S3_ENDPOINT
             value: rook-ceph-rgw-nautiluss3.rook
           - name: DEBIAN_FRONTEND
             value: noninteractive
           - name: QT_QPA_PLATFORM
             value: offscreen
      nodeSelector:
        nautilus.io/disktype: nvme
      restartPolicy: Never
      volumes:
      - name: gcloud-service-account
        secret:
          secretName: adap23-scorecard-gcloud
      - name: work-queue
        persistentVolumeClaim:
            claimName: pypeit-adap-work-queue
      - name: prp-s3-credentials
        secret:
          secretName: prp-s3-credentials            
      - emptyDir: {}
        name: ephemeral
