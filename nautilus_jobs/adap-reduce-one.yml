# Reduce a single dataset, named in the DATASET environment variable below,
# instead of pulling datasets from the redis work queue. This is the debugging
# counterpart of adap-reduce-lris-from-queue.yml: same container, same scripts,
# same reduction, but no queue and no redis server needed.
#
# DATASET is a path relative to the raw data root (see get_cloud_path in
# scripts/rclone.py), in the form <target>/<YYYYMMDD>/<LRIS|LRISBLUE> as laid
# out by adap_koa_download.yml. Set it before applying this job.
#
# reduce_from_queue.py --dataset does not touch the work queue status column of
# the scorecard spreadsheet, but it does still upload results to S3 and gdrive
# and update the scorecard, overwriting any previous results for the dataset.
#
# The pod exits non-zero if the reduction fails, and backoffLimit is 0 so the
# failure is not retried. The run is teed to /tmp/reduce_one.log and copied to
# s3://pypeit/adap/results/${POD_NAME}.log either way. Note the script's own
# reduce_from_queue.log is cleared as part of its per dataset cleanup, so the
# teed copy, not that file, is what ends up in S3.
apiVersion: batch/v1
kind: Job
metadata:
  name: adap-reduce-one
spec:
  backoffLimit: 0
  parallelism: 1
  template:
    spec:
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: reduce-worker
        args:
        - source /home/pypeitusr/pypeit_env/bin/activate; pip install awscli redis boto3 google-api-python-client gspread;
          cd /home/pypeitusr/PypeIt; git fetch; git checkout lris_adap; git pull;
          pip install -e '.[dev]'; export PYPEIT_COMMIT=`git log -n 1 | head -n 1 | cut -c 8-47`;
          echo $PYPEIT_COMMIT;
          cd /tmp; mkdir adap_root; cd adap_root;
          git clone https://github.com/pypeit/adap.git; cd adap; git checkout adap_2023;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap/scripts_2023/ scripts/ --recursive;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap/config_2023/ config/ --recursive;
          python scripts/reduce_from_queue.py --rclone_conf config/rclone.conf --adap_root_dir /tmp/adap_root --scorecard_max_age 7 --dataset "${DATASET}" key=15ealTQOBLB0I_BD-ZiN0lVeP1vt5P9oeGeiWOPN4bq0/WorkQueue unused unused s3 2>&1 | tee /tmp/reduce_one.log;
          status=${PIPESTATUS[0]};
          echo $PYPEIT_COMMIT >> /tmp/reduce_one.log; du -sh /tmp >> /tmp/reduce_one.log; tail -2 /tmp/reduce_one.log;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress /tmp/reduce_one.log s3://pypeit/adap/results/${POD_NAME}.log;
          exit $status
        command:
        - /bin/bash
        - -c
        image: gitlab-registry.nrp-nautilus.io/bradh/pypeitcontainers/Dockerfile:adap_2023-lris-reduce-from-queue
        imagePullPolicy: Always
        resources:
          limits:
            cpu: '1.5'
            ephemeral-storage: 100Gi
            memory: 48Gi
          requests:
            cpu: '1'
            ephemeral-storage: 100Gi
            memory: 32Gi
        volumeMounts:
        - mountPath: /home/pypeitusr/.config/gspread/service_account.json
          name: gcloud-service-account
          subPath: credentials
        - mountPath: /tmp
          name: ephemeral
        - mountPath: /home/pypeitusr/.aws/credentials
          name: prp-s3-credentials
          subPath: credentials
        env:
           - name: POD_NAME
             valueFrom:
                fieldRef:
                   fieldPath: metadata.name
           - name: ENDPOINT_URL
             value: http://rook-ceph-rgw-nautiluss3.rook
           - name: S3_ENDPOINT
             value: rook-ceph-rgw-nautiluss3.rook
           - name: DEBIAN_FRONTEND
             value: noninteractive
           - name: QT_QPA_PLATFORM
             value: offscreen
           - name: DATASET
             value: J1030+0524/20120415/LRIS
      nodeSelector:
        nautilus.io/disktype: nvme
      restartPolicy: Never
      volumes:
      - name: gcloud-service-account
        secret:
          secretName: adap-scorecard-gcloud
      - name: prp-s3-credentials
        secret:
          secretName: prp-s3-credentials
      - emptyDir: {}
        name: ephemeral
