# Queue-driven KOA download. Pops a target off the target queue, looks its coordinates up
# in the targets tab of the Scorecard sheet, downloads everything KOA has for it, uploads
# the result to s3://pypeit/adap_2023/raw_data_reorg/, and appends the datasets it found
# to the WorkQueue tab so the reduce stage can pick them up. See koa_download_design.rst.
#
# Seed the target queue before applying this, or the pods time out waiting:
#   POD=$(kubectl get pods -l k8s-app=adap-workqueue -o name --field-selector=status.phase=Running)
#   kubectl exec $POD -- redis-cli lpush adap_2023_targets_q init
#
# parallelism is the real throttle on KOA. Koa.download is a serial loop over the frames
# in a table, so one pod holds exactly one connection and concurrency is simply the pod
# count. Start at 1, watch one target through, and only then consider 2.
# --max_koa_downloads is a backstop for what parallelism cannot see -- a second download
# job, or a hand-run retry, alongside this one.
apiVersion: batch/v1
kind: Job
metadata:
  name: adap-koa-download-from-queue
spec:
  backoffLimit: 0
  parallelism: 1
  template:
    spec:
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: download-worker
        args:
        - source /home/pypeitusr/pypeit_env/bin/activate;
          cd /home/pypeitusr/PypeIt; git fetch; git checkout lris_adap; git pull --ff-only;
          pip install --no-build-isolation -e '.[dev]';
          cd /tmp; mkdir adap_root; cd adap_root;
          git clone https://github.com/pypeit/adap.git; cd adap; git checkout adap_2023;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap/scripts_2023/ scripts/ --recursive;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap/config_2023/ config/ --recursive;
          python scripts/koa_download_from_queue.py --rclone_conf config/rclone.conf --adap_root_dir /tmp/adap_root
            --max_koa_downloads 2
            Scorecard/targets redis://adap-workqueue:6379 adap_2023_targets s3;
          download_status=$?;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress /tmp/adap_root/koa_download_from_queue.log s3://pypeit/adap/results/${POD_NAME}.log;
          exit $download_status
        command:
        - /bin/bash
        - -c
        image: gitlab-registry.nrp-nautilus.io/bradh/pypeitcontainers/pypeit_lris_adap:adap_2023
        imagePullPolicy: Always
        resources:
          limits:
            cpu: '1.5'
            ephemeral-storage: 64Gi
            memory: 8Gi
          requests:
            cpu: '1.5'
            ephemeral-storage: 64Gi
            memory: 8Gi
        volumeMounts:
        - mountPath: /home/pypeitusr/.config/gspread/service_account.json
          name: gcloud-service-account
          subPath: credentials
        - mountPath: /tmp
          name: ephemeral
        - mountPath: /home/pypeitusr/.aws/credentials
          name: prp-s3-credentials
          subPath: credentials
        env:
           - name: POD_NAME
             valueFrom:
                fieldRef:
                   fieldPath: metadata.name
           - name: ENDPOINT_URL
             value: http://rook-ceph-rgw-nautiluss3.rook
           - name: S3_ENDPOINT
             value: rook-ceph-rgw-nautiluss3.rook
           - name: DEBIAN_FRONTEND
             value: noninteractive
           - name: QT_QPA_PLATFORM
             value: offscreen
      nodeSelector:
        nautilus.io/disktype: nvme
      restartPolicy: Never
      volumes:
      - name: gcloud-service-account
        secret:
          secretName: adap23-scorecard-gcloud
      - name: prp-s3-credentials
        secret:
          secretName: prp-s3-credentials
      - emptyDir: {}
        name: ephemeral
