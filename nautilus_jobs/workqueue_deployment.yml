apiVersion: apps/v1
kind: Deployment
metadata:
  name: adap-workqueue
  labels:
    k8s-app: adap-workqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: adap-workqueue
  template:
    metadata:
      labels:
        k8s-app: adap-workqueue
    spec:
      containers:
      - name: workqueue
        image: docker.io/library/redis:7
        resources:
           limits:
             memory: 500Mi
             cpu: 1
           requests:
             memory: 100Mi
             cpu: 1
        command: ["redis-server"]