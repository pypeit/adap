# Search KOA for each target in the target list and download the matching
# science, arc, and flat frames, organized by download_lib into
# <target>/<YYYYMMDD>/LRIS/raw_r and <target>/<YYYYMMDD>/LRISBLUE/raw_b.
#
# The upload destination is the root reduce_from_queue.py reads from, see
# get_cloud_path in scripts/rclone.py.
#
# The target list is a text file with one "<name> <ra> <dec>" per line, ra/dec
# in degrees. Blank lines and lines starting with "#" are ignored.
apiVersion: batch/v1
kind: Job
metadata:
  name: adap-koa-download
spec:
  backoffLimit: 2
  parallelism: 1
  template:
    spec:
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: download-worker
        args:
        - source /home/pypeitusr/pypeit_env/bin/activate;
          cd /home/pypeitusr/PypeIt; git fetch; git checkout lris_adap; git pull;
          pip install --no-build-isolation -e '.[dev]';
          cd /tmp; mkdir adap_root; cd adap_root;
          git clone https://github.com/pypeit/adap.git; cd adap; git checkout adap_2023;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap/scripts_2023/ scripts/ --recursive;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap/config_2023/ config/ --recursive;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress s3://pypeit/adap_2023/koa_to_download/targets.txt /tmp/targets.txt;
          mkdir -p /tmp/RAW_DATA;
          python scripts/download_lib/download.py /tmp/targets.txt --outdir /tmp/RAW_DATA 2>&1 | tee /tmp/koa_download.log;
          du -sh /tmp/RAW_DATA >> /tmp/koa_download.log;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress /tmp/RAW_DATA/ s3://pypeit/adap_2023/raw_data_reorg/ --recursive;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress /tmp/koa_download.log s3://pypeit/adap/results/${POD_NAME}.log
        command:
        - /bin/bash
        - -c
        image: gitlab-registry.nrp-nautilus.io/bradh/pypeitcontainers/pypeit_lris_adap:adap_2023
        imagePullPolicy: Always
        resources:
          limits:
            cpu: '1.5'
            ephemeral-storage: 64Gi
            memory: 8Gi
          requests:
            cpu: '1.5'
            ephemeral-storage: 64Gi
            memory: 8Gi
        volumeMounts:
        - mountPath: /tmp
          name: ephemeral
        - mountPath: /home/pypeitusr/.aws/credentials
          name: prp-s3-credentials
          subPath: credentials
        env:
           - name: POD_NAME
             valueFrom:
                fieldRef:
                   fieldPath: metadata.name
           - name: ENDPOINT_URL
             value: http://rook-ceph-rgw-nautiluss3.rook
           - name: S3_ENDPOINT
             value: rook-ceph-rgw-nautiluss3.rook
           - name: DEBIAN_FRONTEND
             value: noninteractive
           - name: QT_QPA_PLATFORM
             value: offscreen
      nodeSelector:
        nautilus.io/disktype: nvme
      restartPolicy: Never
      volumes:
      - name: prp-s3-credentials
        secret:
          secretName: prp-s3-credentials
      - emptyDir: {}
        name: ephemeral
