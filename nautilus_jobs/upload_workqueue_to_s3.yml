apiVersion: batch/v1
kind: Job
metadata:
  name: adap-upload-workqueue
spec:
  backoffLimit: 0
  template:
    spec:
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - args:
        - source /home/pypeitusr/pypeit_env/bin/activate;
          aws --endpoint $ENDPOINT_URL s3 cp --no-progress /work_queue/work_queue_2023.csv s3://pypeit/adap/results/work_queue_2023.csv
        command:
        - /bin/bash
        - -c
        env:
        - name: ENDPOINT_URL
          value: http://rook-ceph-rgw-nautiluss3.rook
        image: gitlab-registry.nrp-nautilus.io/bradh/pypeitcontainers/pypeit_lris_adap:adap_2023
        imagePullPolicy: Always
        name: container
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - mountPath: /home/pypeitusr/.aws/credentials
          name: prp-s3-credentials
          subPath: credentials
        - mountPath: /work_queue
          name: work-queue
      restartPolicy: Never
      volumes:
      - name: work-queue
        persistentVolumeClaim:
            claimName: pypeit-adap-work-queue
      - name: prp-s3-credentials
        secret:
          secretName: prp-s3-credentials